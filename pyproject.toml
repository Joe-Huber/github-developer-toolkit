[project]
name = "github-developer-toolkit"
version = "0.1.0"
description = "An open-source system that helps developers improve, analyze, and showcase their GitHub presence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe-Huber" }]
keywords = ["github", "analyzer", "developer-toolkit", "profile-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.9",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
ghdtk = "ghdtk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghdtk"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["build/", "dist/"]
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage]
[tool.coverage.run]
source = ["ghdtk"]

[tool.coverage.report]
fail_under = 95
show_missing = true
